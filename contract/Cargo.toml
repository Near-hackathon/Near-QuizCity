[package]
name = "quizcity"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "=5.30.1", features = ["legacy"] }
serde_json = "1"

[dev-dependencies]
near-sdk = { version = "=5.30.1", features = ["legacy", "unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
panic = "abort"
strip = true
debug = false
