# fly.toml app configuration file generated for near-quizcity on 2026-11-14T21:54:15Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'near-quizcity'
primary_region = 'ams'
kill_signal = 'SIGINT'
kill_timeout = '20s'

[build]
  dockerfile = 'server/Dockerfile'

[deploy]
  strategy = 'immediate'
  release_command = 'npm run db:push --workspace=server'
  release_command_timeout = '10m0s'

[env]
  APP_ENV = 'production'
  CHAIN_SOURCE_REQUIRED = '0'
  HOST = '0.0.0.0'
  NODE_ENV = 'production'
  PGSSL = 'require'
  PORT = '8787'
  READINESS_TIMEOUT_MS = '10000'

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '15s'
    timeout = '5s'
    grace_period = '30s'
    method = 'GET'
    path = '/health/live'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
